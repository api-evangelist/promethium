aid: promethium
name: Promethium
description: >-
  Promethium is an open agentic data platform that gives analysts, business users, and AI
  agents trusted access to all enterprise data through a single governed layer without moving,
  copying, or consolidating data. Its AI Insights Fabric combines a zero-copy federated
  Universal Query Engine (Trino) across cloud warehouses, relational databases, SaaS apps and
  on-prem systems, an Insights Context Graph that assembles business definitions and semantic
  models, and a Trust Harness that validates answers before delivery. Promethium exposes
  governed data to any agent, copilot, or application through a single MCP server or REST API,
  with its Mantra engine powering plain-English agentic analytics. Backed by Insight Partners;
  led by CEO Prat Moghe.
